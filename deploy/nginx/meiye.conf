# ============================================================
# 美业大健康数字化平台 · Nginx 多子域名配置
# 适用：Nginx 1.20+，HTTPS 证书可用 certbot 或宝塔申请
# 替换：example.com / 证书路径 / 后端端口
# ============================================================

# ---------- 限流区（防刷/防重） ----------
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# ---------- 上游 ----------
upstream meiye_backend {
    server 127.0.0.1:8081;
    keepalive 64;
}

# ---------- HTTP 统一跳 HTTPS（保留微信校验文件） ----------
server {
    listen 80;
    server_name api.example.com admin.example.com www.example.com m.example.com worker.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 微信/支付宝域名校验文件（放到 /var/www/meiye/verify/）
    location ~ ^/(MP_verify_.+\.txt|wx_.+\.txt)$ {
        root /var/www/meiye/verify;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# API 网关
# ============================================================
server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 50m;
    limit_conn conn_per_ip 40;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/meiye-api.access.log;
    error_log  /var/log/nginx/meiye-api.error.log warn;

    # 健康检查不记录、不限流
    location = /api/health {
        proxy_pass http://meiye_backend;
        access_log off;
    }

    # 登录/注册接口严格限流
    location ~ ^/api/(auth/login|auth/wechat/.*)$ {
        limit_req zone=api_login burst=10 nodelay;
        proxy_pass http://meiye_backend;
        include /etc/nginx/snippets/meiye-proxy.conf;
    }

    # 上传/导出接口放宽超时
    location ~ ^/api/(files|tenant/reports|platform/reports|tenant/print) {
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://meiye_backend;
        include /etc/nginx/snippets/meiye-proxy.conf;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://meiye_backend;
        include /etc/nginx/snippets/meiye-proxy.conf;
    }

    # 微信回调（公众平台服务器 URL）
    location /api/public/wechat/ {
        proxy_pass http://meiye_backend;
        include /etc/nginx/snippets/meiye-proxy.conf;
    }

    # MinIO 控制台不对外；如需对象直链使用预签名 URL
    location / {
        return 404;
    }
}

# ============================================================
# 平台管理端
# ============================================================
server {
    listen 443 ssl http2;
    server_name admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/meiye/admin;
    index index.html;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/meiye-admin.access.log;

    location /api/ {
        proxy_pass http://meiye_backend;
        include /etc/nginx/snippets/meiye-proxy.conf;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============================================================
# 品牌门户（SEO / 分享落地页）
# ============================================================
server {
    listen 443 ssl http2;
    server_name www.example.com example.com;

    ssl_certificate     /etc/letsencrypt/live/www.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/meiye/portal;
    index index.html;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/meiye-portal.access.log;

    # 微信 JS 安全域名校验
    location ~ ^/MP_verify_.+\.txt$ {
        root /var/www/meiye/verify;
        default_type text/plain;
    }

    location /api/ {
        proxy_pass http://meiye_backend;
        include /etc/nginx/snippets/meiye-proxy.conf;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

